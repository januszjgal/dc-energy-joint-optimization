protocol:
  id: v6-ramp-pure-rl-preregistered-v2
  title: Pure PPO robust causal ramp campaign v2
  status: frozen
  predecessor_protocol: v6-ramp-pure-rl-preregistered-v1
  predecessor_confirmation_commit: 3391440d168ade7127899a8a2c2d84e3a47a9ad3
  predecessor_failure_reinterpreted: false

environment_protocol:
  path: env/protocols/v6_ramp_pure_rl_v2.yaml
  id: ramp-v6-pure-rl-frozen-v2
  panel_schema: env/protocols/v6_ramp_panel.schema.json
  cadence: hourly UTC
  semantic_action_id: ramp-v6-constraint-decoded-preferences-2n-plus-1-v1
  dimensions_for_n_sites: 2N+1
  bounds: [-6.0, 6.0]

attribution:
  random_initialization_only: true
  safe_random_feasible_warmup_allowed: true
  teacher: false
  behavior_cloning: false
  demonstrations: false
  expert_replay: false
  warm_start: false
  analytic_economic_base: false
  mpc_actions: false
  offline_expert_labels: false
  optimizer_actions: false
  oracle_reward_shaping: false
  curriculum_trajectories: false
  analytic_or_qp_controller_role: evaluation-only-oracle-bound

data:
  interval_minutes: 60
  split:
    train:
      months: [2025-09, 2025-10, 2025-11, 2025-12, 2026-01]
      randomized_chronological_windows: true
    validation:
      months: [2026-02]
      sealed_from_normalization: true
    test:
      months: [2026-03, 2026-04]
      sealed: true
      tune_or_select: false
  forecast:
    model_id: energy-v3-causal-h3-trajectory-gross-net-ridge-v1
    identity_required_in_every_manifest: true
    realized_future_features_prohibited: true

training:
  stable_baselines3: 2.9.0
  gamma: 1.0
  actual_terminals: true
  bootstrap_across_terminal: false
  history_hours: 3
  terminal_tail_hours: 3
  ramp_horizons_hours: [1, 3]
  vectorized_environments: 4
  action_contract: ramp-v6-constraint-decoded-preferences-2n-plus-1-v1
  raw_redundant_projected_logits: false
  early_stopping_timesteps: 100000
  effective_boundary_timesteps: 110592
  allowed_seeds: [2701, 2702, 2703, 2704, 2705]
  early_stopping_basis: v1 validation peaked at 100k and degraded 17.9192% by 500k
  normalization:
    fit_split: train
    freeze_for: [validation, test]
    observation: true
    reward: false
    reward_training_only: false

algorithms:
  ppo:
    pure_rl: true
    gamma: 1.0
    gae_lambda: 0.95
    n_steps: 512
    batch_size: 256
    n_epochs: 5
    learning_rate: 0.0001
    target_kl: 0.02
    net_arch: [256, 256]
  sac:
    pure_rl: true
    gamma: 1.0
    n_steps: 36
    learning_starts: 4096
    buffer_size: 500000
    batch_size: 256
    train_freq: 1
    gradient_steps: 1
    learning_rate: 0.0003
    net_arch: [256, 256]

multiobjective:
  primary: ramp_and_terminal_tail
  primary_energy_budget_pct: 2.0
  epsilon_sensitivity_pct: [0.0, 2.0, 5.0]
  selection_data: validation
  test_used_for_selection: false
  hard_workload_safety: non-negotiable
  lagrangian:
    update_data: [train, validation]
    test_updates: false
    initial_multiplier: 0.0
    learning_rate: 0.01
    maximum: 100.0
    rule: projected_dual_ascent

campaign:
  stages:
    fixture_smoke:
      deterministic: true
      long_campaign: false
    screen:
      algorithms: [ppo]
      seeds: 3
      seed_values: [2701, 2702, 2703]
      timesteps: 100000
      promotion: all-strict-validation-gates
    confirmation:
      algorithms: [ppo]
      seeds: 5
      seed_values: [2701, 2702, 2703, 2704, 2705]
      timesteps: 100000
      promotion: all-strict-validation-gates
    extension:
      enabled: false
      seed_values: [2701, 2702, 2703, 2704, 2705]
      max_timesteps: 100000
      validation_curve_materiality_required: false
      preregistered_material_improvement_pct: 1.0
  resumable_isolated_jobs: true
  deterministic_evaluation: true
  final_campaign_blocked_until: [energy-model-v3-ramp-panel]

success_gate:
  exact_service_completion_all_seeds: true
  exact_batch_completion_all_seeds: true
  zero_expiry: true
  zero_terminal_work: true
  zero_certificate_violations: true
  validation_and_test_mean_ramp_improvement: true
  per_market_macro_ramp_improvement: true
  report_adjusted_p95_and_max_horizons_hours: [1, 3]
  primary_da_cost_ratio_max: 1.02
  behavior_pre_service_before_forecast_ramps: true
  behavior_lower_dc_power_during_realized_ramps: true
  future_leakage: false
  emergency_feasibility_rate_lt: 0.01
  raw_unshaped_evidence_selects: true
  failure_is_publishable: true
  failed_gate_must_be_identified: true
  iteration_data: [train, validation]
  sealed_test_tuning: false
