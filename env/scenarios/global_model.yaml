# Global Model: 4 data centers across 3 continents (~16-hour timezone spread).
# DCs are pure grid-connected loads — no on-site solar. Reward combines
# operator cost with a peak-contribution penalty (see us_model.yaml for details).
# NL net demand is from ENTSO-E-style synthesis; Singapore is approximated
# (EMA does not publish renewable-decomposed demand).

power_model: data/power_model_params.json

batch:
  flexibility_factor: 1.0
  deadline_penalty_weight: 250.0   # calibrated to ~energy cost of serving a unit; see thesis_overview §7.8
  urgency_horizon_steps: 12

sites:
  - name: Global-US-West
    cell: data/cells/cell_a.csv
    solar: data/solar/the_dalles_or.csv
    price: data/prices/caiso.csv
    net_demand: data/net_demand/caiso.csv
    machines: data/machines/machines_a.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_a.json

  - name: Global-US-Central
    cell: data/cells/cell_b.csv
    solar: data/solar/council_bluffs_ia.csv
    price: data/prices/miso.csv
    net_demand: data/net_demand/miso.csv
    machines: data/machines/machines_b.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_b.json

  - name: Global-EU
    cell: data/cells/cell_c.csv
    solar: data/solar/eemshaven_nl.csv
    price: data/prices/entso_e_nl.csv
    net_demand: data/net_demand/entso_e_nl.csv
    machines: data/machines/machines_c.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_c.json

  - name: Global-Asia
    cell: data/cells/cell_d.csv
    solar: data/solar/singapore.csv
    price: data/prices/ema_singapore.csv
    net_demand: data/net_demand/ema_singapore.csv
    machines: data/machines/machines_d.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_d.json
