name: ppo-hard-safety-v4
status: exploratory-post-v3
parent_protocol: ppo-reward-sweep-v3
parent_git_commit: a989465
excluded:
  - model_predictive_control
  - spatial_only_training
  - temporal_only_training

claim_scope:
  development_cells: a-d
  descriptive_transfer_cells: e-h
  fresh_confirmatory_data_available: false
  interpretation: >-
    V4 isolates a one-step hard feasibility projection around the selected v3
    joint PPO configurations. Cells e-h remain descriptive only because they
    were already exposed by v2/v3.

actionable_state:
  exclude_deadline_step_lte_current_from_actionable_pool: true
  due_now_unavoidable_mass_is_audit_only: true
  deadline_semantics: >-
    An entry with deadline_step d is serviceable through d-1 and expires before
    service at d. The v4 projector fails closed if such carryover reaches a step.

safety:
  service_envelope_total: 2.25
  batch_arrival_envelope_total: 1.0
  future_fleet_capacity_total: 4.0
  guaranteed_carried_batch_capacity: 0.75
  envelope_id: ad-rounded-envelope-v1
  envelope_scope: a-d-development-only
  envelope_provenance: >-
    Rounded upward from the maximum total service and batch arrival observed
    across development cells a-d only: service max 2.130388, batch max 0.831723.
    The same rounded constants are frozen before replay/training and never use
    realized future evaluation values.
  clean_state_service_guarantee: true
  preexisting_local_service_backlog: fail_closed
  cumulative_exact_edf: true
  exact_origin_destination_conservation: true
  exact_drain_endpoints: true
  primary_negative_demand_flush: false
  negative_demand_flush_ablation: true
  primary_power_caps: null
  primary_ramp_caps: null

selected_configs:
  us:
    scenario: env/scenarios/us_model_v2_2025.yaml
    descriptive_transfer_scenario: env/scenarios/us_model_eh_v2_2025.yaml
    source_combo: R3_P1
    ppo:
      learning_rate: 0.0003
      learning_rate_schedule: linear
      n_steps: 2048
      batch_size: 64
      n_epochs: 10
      gamma: 1.0
      gae_lambda: 0.99
      target_kl: 0.02
      normalize_observations: false
      net_arch:
        - 128
        - 128
    reward:
      service_backlog_weight: 700.0
      batch_completion_weight: 1000.0
      urgency_potential_weight: 0.0
      subtract_idle_cost: false
      reward_scale: 0.0001
    final_budget: 151552
  global:
    scenario: env/scenarios/global_model_v2_2025.yaml
    descriptive_transfer_scenario: env/scenarios/global_model_eh_v2_2025.yaml
    source_combo: R0_P3
    ppo:
      learning_rate: 0.0003
      learning_rate_schedule: fixed
      n_steps: 2048
      batch_size: 64
      n_epochs: 10
      gamma: 1.0
      gae_lambda: 0.95
      target_kl: null
      normalize_observations: false
      net_arch:
        - 128
        - 128
    reward:
      service_backlog_weight: 700.0
      batch_completion_weight: 1500.0
      urgency_potential_weight: 250.0
      subtract_idle_cost: false
      reward_scale: 0.0001
    final_budget: 1003520

replay:
  selected_v3_seeds:
    - 201
    - 202
    - 203
    - 204
    - 205
    - 206
    - 207
    - 208
    - 209
    - 210
  modes:
    - safety_only
    - safety_plus_negative_demand_flush

stages:
  short:
    timesteps: 151552
    seeds:
      - 301
      - 302
      - 303
  medium:
    timesteps: 301056
    seeds:
      - 301
      - 302
      - 303
      - 304
      - 305
  full:
    seeds:
      - 301
      - 302
      - 303
      - 304
      - 305
      - 306
      - 307
      - 308
