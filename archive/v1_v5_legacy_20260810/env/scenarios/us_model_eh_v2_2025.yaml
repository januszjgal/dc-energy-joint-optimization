_energy_model: 'v2-2025: one real CAISO price/net-demand archetype shifted by IANA
  local wall time; no regional re-averaging'
_capacity_model: equal 100 MW proxy DCs; source cell utilization maps to unit normalized
  capacity at every site
_protocol: env/protocols/v2_2025.yaml
power_model: data/power_model_params.json
per_cell_power: true
batch:
  flexibility_factor: 1.0
  deadline_penalty_weight: 250.0
  urgency_horizon_steps: 12
sites:
- name: US-Pacific
  cell: data/cells/cell_e.csv
  tier_curves: data/cells/cell_e_tiers.csv
  solar: data/energy_model_v2/2025/processed/us_pacific.csv
  price: data/energy_model_v2/2025/processed/us_pacific.csv
  net_demand: data/energy_model_v2/2025/processed/us_pacific.csv
  net_demand_column: net_demand_signed
  machines: data/machines/machines_e.csv
  rated_power_mw: 100.0
  capacity: 1.0
  memory_capacity: 1.0
  batch_distributions: data/jobs/batch_distributions_e.json
- name: US-Mountain
  cell: data/cells/cell_f.csv
  tier_curves: data/cells/cell_f_tiers.csv
  solar: data/energy_model_v2/2025/processed/us_mountain.csv
  price: data/energy_model_v2/2025/processed/us_mountain.csv
  net_demand: data/energy_model_v2/2025/processed/us_mountain.csv
  net_demand_column: net_demand_signed
  machines: data/machines/machines_f.csv
  rated_power_mw: 100.0
  capacity: 1.0
  memory_capacity: 1.0
  batch_distributions: data/jobs/batch_distributions_f.json
- name: US-Central
  cell: data/cells/cell_g.csv
  tier_curves: data/cells/cell_g_tiers.csv
  solar: data/energy_model_v2/2025/processed/us_central.csv
  price: data/energy_model_v2/2025/processed/us_central.csv
  net_demand: data/energy_model_v2/2025/processed/us_central.csv
  net_demand_column: net_demand_signed
  machines: data/machines/machines_g.csv
  rated_power_mw: 100.0
  capacity: 1.0
  memory_capacity: 1.0
  batch_distributions: data/jobs/batch_distributions_g.json
- name: US-Eastern
  cell: data/cells/cell_h.csv
  tier_curves: data/cells/cell_h_tiers.csv
  solar: data/energy_model_v2/2025/processed/us_eastern.csv
