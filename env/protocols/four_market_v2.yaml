protocol:
  id: four-market-direct-k1-v2-raw-workload
data:
  interval_minutes: 60
  markets: [CAISO_NP15, MISO_MINN_HUB, SPP_NORTH_HUB, ISONE_NEMA]
  workload_mapping: [a, b, c, d]
  split:
    train: {months: [2025-10, 2025-11, 2025-12, 2026-01]}
    validation: {months: [2026-02]}
    test: {months: []}
  forecast:
    model_id: energy-v3-causal-h3-trajectory-gross-net-ridge-v1
    realized_future_features_prohibited: true
fleet:
  site_count: 4
  compute_capacity_per_site: 1.0
  rated_power_mw_per_site: 500.0
  total_rated_power_mw: 2000.0
workload:
  deadline_hours: [2, 1, 2, 3]
  source: raw_measured_service_and_batch
objective:
  ramp_horizons_hours: [1, 3]
  ramp_weights: {1: 0.40, 3: 0.60}
  market_aggregation: equal_market_mean
training:
  vectorized_environments: 4
  ppo:
    net_arch: [64, 64]
    gae_lambda: 0.95
    n_steps: 512
    batch_size: 256
    n_epochs: 10
    learning_rate: 0.0003
