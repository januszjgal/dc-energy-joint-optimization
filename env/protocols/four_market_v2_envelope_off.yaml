protocol:
  id: four-market-direct-k1-v2-envelope-off
  title: Four-market direct K=1 paired PPO validation
  status: large-non-final-validation
  sealed_test_access: false
data:
  interval_minutes: 60
  markets: [CAISO_NP15, MISO_MINN_HUB, SPP_NORTH_HUB, ISONE_NEMA]
  workload_mapping: [a, b, c, d]
  split:
    train: {months: [2025-10, 2025-11, 2025-12, 2026-01]}
    validation: {months: [2026-02]}
    test: {months: []}
  forecast:
    model_id: energy-v3-causal-h3-trajectory-gross-net-ridge-v1
    realized_future_features_prohibited: true
variant:
  id: envelope_off
  admission_envelope_enabled: false
  service_envelope_fraction_of_fleet: 0.75
  batch_arrival_envelope_fraction_of_fleet: 0.10
  excess_batch_handling: preserve_raw_measured_service_and_batch
fleet:
  site_count: 4
  compute_capacity_per_site: 1.0
  rated_power_mw_per_site: 500.0
  total_rated_power_mw: 2000.0
objective:
  ramp_horizons_hours: [1, 3]
  ramp_weights: {1: 0.40, 3: 0.60}
  residual_tail_weight: 0.15
  market_aggregation: equal_market_mean
training:
  vectorized_environments: 4
algorithms:
  ppo:
    net_arch: [64, 64]
    gae_lambda: 0.95
    n_steps: 512
    batch_size: 256
    n_epochs: 10
    learning_rate: 0.0003
multiobjective:
  primary_energy_budget_pct: 2.0
  epsilon_sensitivity_pct: [2.0]
  lagrangian:
    initial_multiplier: 0.0
    learning_rate: 0.01
    maximum: 100.0
