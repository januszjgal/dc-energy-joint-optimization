protocol:
  id: four-market-direct-k1-v2-raw-workload-continuous-month
data:
  interval_minutes: 60
  markets: [CAISO_NP15, MISO_MINN_HUB, SPP_NORTH_HUB, ISONE_NEMA]
  workload_mapping: [a, b, c, d]
  episode_unit: one continuous calendar month; queues and power history reset only at the month boundary
  history_hours: 1
  split:
    train: {months: [2025-01, 2025-02, 2025-03, 2025-04, 2025-06, 2025-07, 2025-08, 2025-09, 2025-10, 2025-11, 2025-12]}
    validation: {months: [2025-05]}
    test: {months: []}
  forecast:
    model_id: causal-ridge-shortlag-v2
    decision_hour_reads_grid_rows_through: t-1
    realized_future_features_prohibited: true
fleet:
  site_count: 4
  compute_capacity_per_site: 1.0
  rated_power_mw_per_site: 500.0
  total_rated_power_mw: 2000.0
workload:
  deadline_hours: [24, 24, 24, 24]
  deadline_semantics: inclusive execution-window length H; an arrival in slot t may run in slots t .. t+H-1, so the longest delay is H-1 hours. Uniform across sites.
  source: raw_measured_service_and_batch
objective:
  ramp_horizons_hours: [1]
  ramp_weights: {1: 1.0}
  market_aggregation: sum
  scored_slots: every decision slot of the month
training:
  vectorized_environments: 4
  checkpoint_rollouts: 25
  ppo:
    net_arch: [64, 64]
    gamma: 0.99
    gae_lambda: 0.95
    n_steps: 512
    batch_size: 256
    n_epochs: 10
    learning_rate: 0.0003
