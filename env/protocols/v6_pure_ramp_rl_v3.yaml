protocol:
  id: v6-ramp-pure-rl-v1-replication-earlystop-v3
  title: Immutable original-v1 PPO replication at the 100k early stop
  status: frozen-before-training
  hypothesis: original-v1-policy-reward-and-hyperparameters-replicate-at-100k
  scientific_links:
    v1_closeout: "b1bb302"
    v1_100k_screen: "7b21499"
    v1_500k_confirmation: "3391440"
    v2_b_failure: "0d3dcab"
    v2_a_failure: "82f1601"
  frozen_predecessor_artifacts_untouched: true

environment_protocol:
  path: env/protocols/v6_ramp_pure_rl.yaml
  id: ramp-v6-pure-rl-frozen-v1
  panel_schema: env/protocols/v6_ramp_panel.schema.json
  cadence: hourly UTC
  semantic_action_id: ramp-v6-constraint-decoded-preferences-2n-plus-1-v1
  dimensions_for_n_sites: 2N+1
  bounds: [-6.0, 6.0]
  execution_source_commit: b1bb302

attribution:
  random_initialization_only: true
  safe_random_feasible_warmup_allowed: true
  teacher: false
  behavior_cloning: false
  demonstrations: false
  expert_replay: false
  warm_start: false
  analytic_economic_base: false
  mpc_actions: false
  offline_expert_labels: false
  optimizer_actions: false
  oracle_reward_shaping: false
  curriculum_trajectories: false
  analytic_or_qp_controller_role: evaluation-only-oracle-bound

data:
  interval_minutes: 60
  split:
    train:
      months: [2025-09, 2025-10, 2025-11, 2025-12, 2026-01]
      randomized_chronological_windows: true
    validation:
      months: [2026-02]
      sealed_from_normalization: true
    test:
      months: [2026-03, 2026-04]
      sealed: true
      open_condition: all-five-validation-seeds-pass-every-strict-gate
      open_count_max: 1
      tune_or_select: false
  forecast:
    model_id: supplied-by-v6-adapter
    vintage_id: supplied-by-v6-adapter
    identity_required_in_every_manifest: true
    realized_future_features_prohibited: true

training:
  stable_baselines3: 2.9.0
  allowed_seeds: [2801, 2802, 2803, 2804, 2805]
  nominal_target_timesteps: 100000
  effective_boundary_timesteps: 110592
  stop_rule: first-complete-ppo-rollout-and-vector-episode-boundary-at-or-after-nominal-target
  gamma: 1.0
  actual_terminals: true
  bootstrap_across_terminal: false
  history_hours: 3
  terminal_tail_hours: 3
  ramp_horizons_hours: [1, 3]
  vectorized_environments: 4
  action_contract: ramp-v6-constraint-decoded-preferences-2n-plus-1-v1
  raw_redundant_projected_logits: false
  normalization:
    fit_split: train
    freeze_for: [validation, test]
    observation: true
    reward_training_only: true

algorithms:
  ppo:
    pure_rl: true
    gamma: 1.0
    gae_lambda: 0.95
    n_steps: 512
    batch_size: 256
    n_epochs: 10
    learning_rate: 0.0003
    net_arch: [256, 256]

multiobjective:
  primary: ramp_and_terminal_tail
  primary_energy_budget_pct: 2.0
  epsilon_sensitivity_pct: [0.0, 2.0, 5.0]
  selection_data: validation
  test_used_for_selection: false
  hard_workload_safety: non-negotiable
  lagrangian:
    update_data: [train, validation]
    test_updates: false
    initial_multiplier: 0.0
    learning_rate: 0.01
    maximum: 100.0
    rule: projected_dual_ascent

campaign:
  stage: five-seed-confirmation
  algorithms: [ppo]
  seed_values: [2801, 2802, 2803, 2804, 2805]
  nominal_timesteps: 100000
  effective_boundary_timesteps: 110592
  parallel_training: true
  resumable_isolated_jobs: false
  deterministic_evaluation: true
  automatic_follow_on_protocol: false

success_gate:
  apply_to_every_seed_without_aggregation: true
  exact_service_completion: true
  exact_batch_completion: true
  zero_expiry: true
  zero_terminal_work: true
  zero_certificate_violations: true
  macro_raw_incremental_ramp_impact_lt: 0.0
  every_market_raw_incremental_ramp_impact_lt: 0.0
  primary_da_cost_ratio_max: 1.02
  emergency_feasibility_rate_lt: 0.01
  behavior_pre_service_gt: 0.0
  behavior_policy_ramp_power_lt_status_quo: true
  future_leakage: false
  post_hoc_tolerance: false
  failure_is_publishable: true
  failed_gate_must_be_identified: true

post_selection:
  enabled_if_and_only_if_all_five_validation_seeds_pass: true
  sealed_test_months: [2026-03, 2026-04]
  sealed_test_open_count: 1
  evaluate_all_five_seeds: true
  robustness:
    - one-gw-total
    - c-h-overlapping
  canonical_evidence: true
