name: ppo-reward-sweep-v3
status: exploratory-post-hoc
parent_protocol: energy-model-v2-2025
excluded:
  - model_predictive_control
  - spatial_only_training

controller_scope:
  active: joint_temporal_and_spatial
  spatial_only_status: historical_v2_evidence_only
  primary_comparator: status_quo_local_no_deferral
  diagnostic_comparators:
    - round_robin
    - drain_immediately

state_repair:
  defect: >-
    Frozen v2 charged joint policies for terminal batch work while omitting
    episode position whenever the primary demand-charge rate was zero.
  interpretation: >-
    The v2 joint negative result is conditional on a partially observable state
    representation, not clean evidence that PPO cannot learn joint control.

proxy_limitation:
  equal_rated_power_mw: 100.0
  equal_normalized_capacity: 1.0
  removed_real_fleet_size_heterogeneity: true
  interpretation: >-
    Equal proxy size isolates workload, market phase, and calibrated power-model
    effects but removes fleet-size heterogeneity and may reduce US spatial
    opportunity. This is an explicit controlled-system limitation.

development_scope:
  train_cells: a-d
  train_scenarios:
    us: env/scenarios/us_model_v2_2025.yaml
    global: env/scenarios/global_model_v2_2025.yaml
  post_selection_transfer_cells: e-h
  evaluation_scenarios:
    us: env/scenarios/us_model_eh_v2_2025.yaml
    global: env/scenarios/global_model_eh_v2_2025.yaml
  interpretation: >-
    Post-hoc exploratory development after the frozen v2 results. The e-h cells
    were previously exposed by v2 and cannot provide fresh confirmatory evidence.
    Their one-time use is a descriptive transfer check, not a success gate or
    headline result.
  fresh_confirmatory_data_available: false
  headline_eligible: false

environment:
  gamma: 1.0
  peak_penalty_weight: 0.015
  flexibility_factor: 1.0
  domain_randomization: true
  observe_episode_progress: true
  deadline_bucket_edges:
    - 1
    - 3
    - 6
    - 12
    - 24
  reward_scale: 0.0001
  evaluation_service_backlog_weight: 1000.0
  evaluation_batch_completion_weight: 1000.0
  reward_weight_sweep_changes_evaluation_objective: false

ppo:
  learning_rate: 0.0003
  n_steps: 2048
  n_epochs: 10
  net_arch:
    - 128
    - 128
  gamma: 1.0
  ent_coef: 0.0
  clip_range_vf: null
  normalize_advantage: true
  orthogonal_initialization: true
  policy_value_networks: separate

round_1:
  timesteps: 151552
  seeds:
    - 201
    - 202
    - 203
  promote_per_region: 1
  candidates:
    R0:
      gae_lambda: 0.95
      reward_mode: full
      normalize_observations: false
      learning_rate_schedule: fixed
      target_kl: null
      batch_size: 64
    R1:
      gae_lambda: 0.99
      reward_mode: full
      normalize_observations: false
      learning_rate_schedule: fixed
      target_kl: null
      batch_size: 64
    R2:
      gae_lambda: 1.0
      reward_mode: full
      normalize_observations: false
      learning_rate_schedule: fixed
      target_kl: null
      batch_size: 64
    R3:
      gae_lambda: 0.99
      reward_mode: full
      normalize_observations: false
      learning_rate_schedule: linear
      target_kl: 0.02
      batch_size: 64
    R4:
      gae_lambda: 0.99
      reward_mode: idle_subtracted
      normalize_observations: false
      learning_rate_schedule: linear
      target_kl: 0.02
      batch_size: 64
    R5:
      gae_lambda: 0.99
      reward_mode: idle_subtracted
      normalize_observations: true
      learning_rate_schedule: linear
      target_kl: 0.02
      batch_size: 256
  reward:
    service_backlog_weight: 1000.0
    batch_completion_weight: 1000.0
    urgency_potential_weight: 0.0

round_2:
  timesteps: 301056
  seeds:
    - 201
    - 202
    - 203
    - 204
    - 205
  variants:
    P0:
      service_backlog_weight: 1000.0
      batch_completion_weight: 1000.0
      urgency_potential_weight: 0.0
    P1:
      service_backlog_weight: 700.0
      batch_completion_weight: 1000.0
      urgency_potential_weight: 0.0
    P2:
      service_backlog_weight: 700.0
      batch_completion_weight: 2000.0
      urgency_potential_weight: 0.0
    P3:
      service_backlog_weight: 700.0
      batch_completion_weight: 1500.0
      urgency_potential_weight: 250.0

full_development:
  timesteps: 501760
  seeds:
    - 201
    - 202
    - 203
    - 204
    - 205
    - 206
    - 207
    - 208
    - 209
    - 210

budget_scaling:
  purpose: >-
    Diagnose whether the frozen 501,760-step result was compute-limited by
    training the selected joint configuration at three rollout-aligned budgets.
  timesteps:
    - 151552
    - 501760
    - 1003520
  comparison_seeds:
    - 201
    - 202
    - 203
    - 204
    - 205
  selected_budget_replication_seeds:
    - 201
    - 202
    - 203
    - 204
    - 205
    - 206
    - 207
    - 208
    - 209
    - 210
  selection_order:
    - all_seeds_safe
    - safe_seed_count
    - worst_seed_total_cost
    - mean_total_cost
    - lower_training_budget

selection:
  service_completion_floor: 0.999999999
  batch_completion_floor: 0.9999
  expired_tolerance: 0.000000001
  terminal_pool_fraction_tolerance: 0.0001
  max_service_backlog: 0.25
  lexicographic_order:
    - all_seeds_safe
    - safe_seed_count
    - worst_seed_total_cost
    - mean_total_cost

final_gate:
  require_all_seeds_safe: true
  require_positive_optimizer_ci_vs_status_quo: true
  confidence: 0.95
  failure_outcome: >-
    Report the joint PPO recovery as unsuccessful. Do not activate a
    spatial-only, temporal-only, or MPC controller in this protocol.
