# HELD-OUT GENERALIZATION variant (peer-review M2): cells e-h replace a-d.
# Market series (prices/net demand/solar) and rated power are unchanged;
# frozen policies trained on a-d are evaluated here without retraining.
# Global Model: 4 data centers across 3 continents (~16-hour timezone spread).
# DCs are pure grid-connected loads — no on-site solar. Reward combines
# operator cost with a peak-contribution penalty (see us_model.yaml for details).
# NL net demand is from ENTSO-E-style synthesis; Singapore is approximated
# (EMA does not publish renewable-decomposed demand).

power_model: data/power_model_params.json
per_cell_power: true   # per-cell calibrated idle/slope (R2 0.75-0.80); see thesis_overview §3.2

batch:
  flexibility_factor: 1.0
  deadline_penalty_weight: 250.0   # calibrated to ~energy cost of serving a unit; see thesis_overview §7.8
  urgency_horizon_steps: 12

sites:
  - name: Global-US-West
    cell: data/cells/cell_e.csv
    tier_curves: data/cells/cell_e_tiers.csv   # real service/batch split (scripts/derive_tier_curves.py)
    solar: data/solar/the_dalles_or.csv
    price: data/prices/caiso.csv
    net_demand: data/net_demand/caiso.csv
    machines: data/machines/machines_e.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_e.json

  - name: Global-US-Central
    cell: data/cells/cell_f.csv
    tier_curves: data/cells/cell_f_tiers.csv   # real service/batch split (scripts/derive_tier_curves.py)
    solar: data/solar/council_bluffs_ia.csv
    price: data/prices/miso.csv
    net_demand: data/net_demand/miso.csv
    machines: data/machines/machines_f.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_f.json

  - name: Global-EU
    cell: data/cells/cell_g.csv
    tier_curves: data/cells/cell_g_tiers.csv   # real service/batch split (scripts/derive_tier_curves.py)
    solar: data/solar/eemshaven_nl.csv
    price: data/prices/entso_e_nl.csv
    net_demand: data/net_demand/entso_e_nl.csv
    machines: data/machines/machines_g.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_g.json

  - name: Global-Asia
    cell: data/cells/cell_h.csv
    tier_curves: data/cells/cell_h_tiers.csv   # real service/batch split (scripts/derive_tier_curves.py)
    solar: data/solar/singapore.csv
    price: data/prices/ema_singapore.csv
    net_demand: data/net_demand/ema_singapore.csv
    machines: data/machines/machines_h.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_h.json
