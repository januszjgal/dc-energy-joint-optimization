schema_version: energy-model-v3
name: independent-us-six-market-v3
study_role: grid-and-ramp-evidence-preflight
legacy:
  v2_v5_frozen: true
  four_site_ad_eh: frozen_legacy_only
  runtime_dependency: false
calendar:
  cadence: hourly
  timezone: UTC
  candidate_start_utc: '2025-09-01T00:00:00Z'
  candidate_end_utc: '2026-05-01T00:00:00Z'
  candidate_selection:
    required_complete_months: 8
    retrieval_lag_days: 90
    fallback: latest_all_six_intersection
    no_intersection_action: BLOCKED
    forbidden: [shorten, drop_market, interpolate]
  splits:
    train_months: 5
    validation_months: 1
    sealed_test_months: 2
calibration:
  training_only: true
  market_scale: Q95(gross_demand_mw)
  residual_tail_threshold: Q90(net_load_mw / market_scale_mw)
  forbidden_inputs:
    - validation
    - sealed_test
  forbidden_uses:
    - scales
    - thresholds
    - normalization
    - forecast_fitting
    - reward_calibration
capacity:
  primary_site_mw: 100.0
  primary_total_mw: 600.0
  primary_sensitivity_total_mw: 1000.0
  primary_sensitivity_site_mw: 166.6666666667
  non_primary_stress_site_mw: 1000.0
  non_primary_stress_total_mw: 6000.0
  non_stress_penetration_gate: 0.05
  stress_override_explicit: true
  ratios: [P_over_S, P_over_D]
workloads:
  source: Google Borg ClusterData2019 measured cells
  primary_mapping: [a, b, c, d, e, f]
  robustness_mapping: [c, d, e, f, g, h]
  robustness_label: overlapping_non_OOF
  old_mapping: frozen_legacy_only
prices:
  primary: day_ahead_total_lmp
  real_time: separate_sensitivity
  economic_context_not_physical_utilization: true
physical:
  required:
    - gross_demand_mw
    - wind_mw
    - solar_mw
    - net_load_mw
    - market_scale_mw
    - source_quality_flags
  primary_tuple_required: true
  no_synthetic_substitution: true
  optional_eia_930_fallback:
    endpoint: https://api.eia.gov/bulk/EBA.zip
    credential: none
    geography: same_balancing_authority_only
    activation: explicit_capability_only
    silent_substitution: forbidden
forecasts:
  causal_only: true
  horizons_hours: [1, 3]
  maximum_required_horizon_hours: 3
  required_metadata:
    - forecast_issue_utc
    - forecast_vintage_utc
    - forecast_horizon_hours
    - forecast_capability
  forbidden: [realized_future_rt, realized_future_load]
ramp:
  primary_cadence: hourly
  native_subhourly_secondary_only: true
  horizons_hours: [1, 3]
  weights:
    1h: 0.40
    3h: 0.60
  base: (N_t-N_t_minus_h)/(S*h_hours)
  augmented: ((N_t+P_t)-(N_t_minus_h+P_t_minus_h))/(S*h_hours)
  incremental: augmented_squared-base_squared
  residual_tail:
    statistic: training_Q90
    weight: 0.10
  day_ahead_cost_separate: true
anti_gaming:
  warm_history_hours: 3
  terminal_tail_hours: 3
  circular_wrap: forbidden
  common_index: exact_identical
  aggregate_dc_once_per_market: true
quality:
  fail_closed:
    - missing_rows
    - duplicate_rows
    - mixed_preliminary_final
    - unit_ambiguity
    - geography_mismatch
    - missing_primary_physical_tuple
    - missing_credentials
    - incomplete_common_calendar
  fixture_mode: explicitly_synthetic_test_only
