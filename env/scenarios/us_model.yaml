# US Model: 4 data centers within the United States.
# Tests optimization under data sovereignty constraints (~3-hour timezone spread).
# DCs are pure grid-connected loads — no on-site solar. Reward combines
# operator cost (price × grid_mw) with a peak-contribution penalty
# (α × grid_mw² × net_demand_normalized) to encourage grid demand smoothing.

power_model: data/power_model_params.json

batch:
  flexibility_factor: 1.0
  deadline_penalty_weight: 250.0   # calibrated to ~energy cost of serving a unit; see thesis_overview §7.8
  urgency_horizon_steps: 12

sites:
  - name: US-West
    cell: data/cells/cell_a.csv
    tier_curves: data/cells/cell_a_tiers.csv   # real service/batch split (scripts/derive_tier_curves.py)
    solar: data/solar/the_dalles_or.csv         # forecast feature only
    price: data/prices/caiso.csv
    net_demand: data/net_demand/caiso.csv
    machines: data/machines/machines_a.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_a.json

  - name: US-Central
    cell: data/cells/cell_b.csv
    tier_curves: data/cells/cell_b_tiers.csv   # real service/batch split (scripts/derive_tier_curves.py)
    solar: data/solar/council_bluffs_ia.csv
    price: data/prices/miso.csv
    net_demand: data/net_demand/miso.csv
    machines: data/machines/machines_b.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_b.json

  - name: US-Southeast-1
    cell: data/cells/cell_c.csv
    tier_curves: data/cells/cell_c_tiers.csv   # real service/batch split (scripts/derive_tier_curves.py)
    solar: data/solar/douglas_county_ga.csv
    price: data/prices/southern_co.csv
    net_demand: data/net_demand/southern_co.csv
    machines: data/machines/machines_c.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_c.json

  - name: US-Southeast-2
    cell: data/cells/cell_d.csv
    tier_curves: data/cells/cell_d_tiers.csv   # real service/batch split (scripts/derive_tier_curves.py)
    solar: data/solar/berkeley_county_sc.csv
    price: data/prices/duke_carolinas.csv
    net_demand: data/net_demand/duke_carolinas.csv
    machines: data/machines/machines_d.csv
    rated_power_mw: 100.0
    batch_distributions: data/jobs/batch_distributions_d.json
