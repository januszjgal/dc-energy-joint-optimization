    budget_source: selected_configs.region.final_budget

promotion_gate:
  require_all_seeds:
    - service_completion_equals_1
    - batch_completion_equals_1
    - total_expired_equals_0
    - terminal_batch_pool_lte_1e_8
    - terminal_service_backlog_lte_1e_8
    - safety_infeasibility_certificates_equals_0
    - transport_conservation_error_lte_1e-8
  primary_cost_comparator: status_quo_local_no_deferral
  diagnostic_cost_comparator: archived_v3_policy_with_safety_only_replay

required_metrics:
  - safety_intervention_rate
  - mean_and_max_projection_l2
  - mandatory_batch_rate
  - binding_deadline_histogram
  - minimum_deadline_slack
  - exact_zero_drain_count
  - exact_full_drain_count
  - infeasibility_certificates
  - transport_conservation_error
  - optional_flush_activation_rate
